name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          bun -e '
            const { name, version } = await Bun.file("package.json").json();
            if (process.env.RELEASE_TAG !== `v${version}`) {
              throw new Error(`Release tag must match package.json: v${version}`);
            }
            const prerelease = process.env.PRERELEASE === "true";
            if (prerelease !== version.includes("-")) {
              throw new Error("GitHub prerelease status must match the package version");
            }
            const tarball = `${name.replace(/^@/, "").replaceAll("/", "-")}-${version}.tgz`;
            const { appendFileSync } = await import("node:fs");
            appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${tarball}\ndist-tag=${prerelease ? "next" : "latest"}\n`);
          '
      - name: Check, build, and verify tarball
        run: bun run pack:release
      - name: Publish verified tarball
        env:
          TARBALL: ${{ steps.release.outputs.tarball }}
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
        run: npm publish "./$TARBALL" --access public --tag "$DIST_TAG" --ignore-scripts --registry https://registry.npmjs.org/
