name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:unit:coverage
      - run: bun run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 14

  browser:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chrome-desktop, runner: ubuntu-24.04 }
          - { project: chrome-mobile, runner: ubuntu-24.04 }
          - { project: firefox-desktop, runner: ubuntu-24.04-arm }
          - { project: firefox-mobile, runner: ubuntu-24.04-arm }
    # Keep this version in sync with @playwright/test and the local Dockerfile.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      ICEBERG_PERF_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
      # The Playwright image includes browsers, but setup-bun needs unzip.
      - name: Install Bun setup prerequisite
        run: apt-get update && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mesa_shader_cache
          key: mesa-${{ matrix.runner }}-playwright-1.63.0-${{ hashFiles('src/*material*', 'src/ocean.ts') }}
      - name: Layout, scrolling, screenshots, and performance
        run: xvfb-run -a bun x playwright test --project=${{ matrix.project }} --headed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
