name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:unit:coverage
      - run: bun run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 14

  browser:
    name: ${{ matrix.suite.name }} (${{ matrix.profile.project }}, ${{ matrix.profile.runner }})
    runs-on: ${{ matrix.profile.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        profile:
          - { project: chrome-desktop, runner: ubuntu-24.04-arm }
          - { project: chrome-mobile, runner: ubuntu-24.04-arm }
          - { project: firefox-desktop, runner: ubuntu-24.04-arm }
          - { project: firefox-mobile, runner: ubuntu-24.04-arm }
        # Keep frame measurements isolated from interaction and visual checks.
        suite:
          - { name: browser, files: 'layout.spec.ts screenshots.spec.ts' }
          - { name: performance, files: 'performance.spec.ts' }
    # Keep this version in sync with @playwright/test and the local Dockerfile.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      ICEBERG_PERF_PROFILE: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # setup-bun needs unzip. Firefox also requires the home directory to be
      # owned by its user; Actions mounts /github/home with a different owner.
      - name: Prepare the browser container
        run: |
          apt-get update && apt-get install -y --no-install-recommends unzip
          chown "$(id -u):$(id -g)" "$HOME"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/mesa_shader_cache
          key: mesa-${{ matrix.profile.runner }}-playwright-1.63.0-${{ hashFiles('src/*material*', 'src/ocean.ts') }}
      - name: Run ${{ matrix.suite.name }} checks
        run: xvfb-run -a bun x playwright test ${{ matrix.suite.files }} --project=${{ matrix.profile.project }} --headed --global-timeout=60000
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ${{ matrix.suite.name }}-${{ matrix.profile.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
